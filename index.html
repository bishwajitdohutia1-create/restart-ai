<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReStartAI - AI-Powered Re-Employment Platform</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #1e40af;
      margin-bottom: 8px;
    }
    .tagline {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .hero-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      max-width: 600px;
      line-height: 1.3;
      margin: 0 auto 12px;
    }
    .hero-title span {
      color: #2563eb;
    }
    .hero-desc {
      font-size: 0.95rem;
      color: #475569;
      max-width: 500px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      min-width: 140px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
    }
    .btn-secondary {
      background-color: #f1f5f9;
      color: #1e293b;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover {
      background-color: #e2e8f0;
    }
    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.7;
    }
    #file-status {
      font-size: 0.85rem;
      color: #2563eb;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
      word-break: break-all;
    }
    .text-input-area {
      margin-bottom: 16px;
      text-align: left;
    }
    .text-input-area label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
      display: block;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    #result-box {
      margin-top: 24px;
      text-align: left;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      display: none;
    }
    #result-box h3 {
      font-size: 1.1rem;
      color: #1e40af;
      margin-bottom: 10px;
    }
    #result-content {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #334155;
      white-space: pre-wrap;
    }
    .spinner {
      display: none;
      margin: 16px auto;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1>ReStartAI</h1>
    <div class="tagline">AI-Powered Re-Employment Platform</div>
    <div class="hero-title">Your career gap shouldn't <span>define your future.</span></div>
    <p class="hero-desc">ReStartAI helps people returning to work discover opportunities and restart their careers with confidence.</p>
  </header>

  <main class="card">
    <input type="file" id="cv-file" accept=".txt,.pdf,.docx" style="display: none;">
    
    <div class="btn-group">
      <button type="button" class="btn btn-secondary" id="btn-upload">Upload CV File</button>
      <button type="button" class="btn btn-primary" id="btn-analyze">Analyze My CV</button>
    </div>

    <div id="file-status">Selected: <span id="file-name"></span></div>

    <div class="text-input-area">
      <label for="cv-text">Or paste your CV / Career text here:</label>
      <textarea id="cv-text" placeholder="Paste your resume details, skills, and past experience here..."></textarea>
    </div>

    <div class="spinner" id="spinner"></div>

    <div id="result-box">
      <h3>Analysis Result</h3>
      <div id="result-content"></div>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('cv-file');
    const uploadBtn = document.getElementById('btn-upload');
    const analyzeBtn = document.getElementById('btn-analyze');
    const fileStatus = document.getElementById('file-status');
    const fileNameSpan = document.getElementById('file-name');
    const cvText = document.getElementById('cv-text');
    const resultBox = document.getElementById('result-box');
    const resultContent = document.getElementById('result-content');
    const spinner = document.getElementById('spinner');

    let uploadedFileText = "";

    uploadBtn.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileNameSpan.textContent = file.name;
        fileStatus.style.display = 'block';

        const reader = new FileReader();
        reader.onload = (event) => {
          uploadedFileText = event.target.result;
        };
        reader.readAsText(file);
      }
    });

    analyzeBtn.addEventListener('click', async () => {
      const textToAnalyze = cvText.value.trim() || uploadedFileText.trim();

      if (!textToAnalyze) {
        alert('Please paste your CV text or upload a file first.');
        return;
      }

      analyzeBtn.disabled = true;
      spinner.style.display = 'block';
      resultBox.style.display = 'none';

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ cvText: textToAnalyze })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to analyze CV');
        }

        resultContent.textContent = data.analysis || data.result || JSON.stringify(data, null, 2);
        resultBox.style.display = 'block';
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        analyzeBtn.disabled = false;
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
