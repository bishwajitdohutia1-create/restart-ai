<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restart AI - Global Talent Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #060a12; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- Navigation -->
  <nav class="border-b border-slate-800 bg-slate-950/90 backdrop-blur-md sticky top-0 z-50 px-4 md:px-8 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg">R</div>
      <div>
        <h1 class="text-lg font-bold text-white">Restart AI</h1>
        <p class="text-[9px] text-emerald-400 font-bold uppercase tracking-widest">Global Talent Ecosystem</p>
      </div>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 pt-10 space-y-8">
    
    <!-- Experience & Profile Form Section -->
    <section class="bg-slate-900 border border-purple-500/30 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
      <div class="border-b border-slate-800 pb-4">
        <h2 class="text-xl font-bold text-white">Professional Experience Details</h2>
        <p class="text-xs text-slate-400 mt-1">Add your career history, roles, and responsibilities</p>
      </div>
      
      <form id="experienceForm" onsubmit="saveFullProfile(event)" class="space-y-4">
        <!-- Basic Info -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" id="pName" placeholder="Full Name" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-purple-400">
          <input type="email" id="pEmail" placeholder="Email Address" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-purple-400">
        </div>

        <!-- Detailed Experience Block -->
        <div class="bg-slate-950 p-4 md:p-5 rounded-2xl border border-slate-800 space-y-3">
          <p class="text-xs font-bold text-emerald-400">Add Professional Experience:</p>
          <input type="text" id="pCompany" placeholder="Company Name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-400">
          <input type="text" id="pRole" placeholder="Job Title / Designation" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-400">
          <textarea id="pResponsibility" placeholder="Job Profile & Key Responsibilities (What were your core duties?)" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white h-28 focus:outline-none focus:border-emerald-400"></textarea>
        </div>

        <!-- Skills & Gap -->
        <input type="text" id="pSkills" placeholder="Skills (Comma separated, e.g. Management, Sales)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-purple-400">
        <textarea id="pGap" placeholder="Reason for Career Gap (if any)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white h-20 focus:outline-none focus:border-purple-400"></textarea>

        <!-- CV Upload -->
        <div class="border-2 border-dashed border-slate-700 p-4 rounded-xl text-center bg-slate-950">
          <label class="block text-xs text-slate-400 mb-2">Upload Updated Resume (PDF/DOCX)</label>
          <input type="file" id="pCvFile" accept=".pdf,.doc,.docx" class="text-xs text-slate-300 block mx-auto cursor-pointer">
        </div>

        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs py-4 rounded-xl shadow-lg transition">Save & Publish Full Profile</button>
      </form>

      <!-- Saved Profiles Display Area -->
      <div id="savedProfilesContainer" class="hidden pt-4 border-t border-slate-800 space-y-4">
        <h3 class="text-xs font-bold text-purple-400 uppercase">Published Profile:</h3>
        <div id="profilesList" class="space-y-3"></div>
      </div>
    </section>
  </main>

  <script>
    function saveFullProfile(e) {
      e.preventDefault();
      const cvFile = document.getElementById('pCvFile').files[0];
      const profile = {
        name: document.getElementById('pName').value.trim(),
        email: document.getElementById('pEmail').value.trim(),
        company: document.getElementById('pCompany').value.trim(),
        role: document.getElementById('pRole').value.trim(),
        resp: document.getElementById('pResponsibility').value.trim(),
        skills: document.getElementById('pSkills').value.trim(),
        gap: document.getElementById('pGap').value.trim(),
        cvName: cvFile ? cvFile.name : "No CV Attached"
      };

      let profiles = JSON.parse(localStorage.getItem('restartAiFullProfiles') || '[]');
      profiles.unshift(profile);
      localStorage.setItem('restartAiFullProfiles', JSON.stringify(profiles));

      displaySavedProfiles();
      alert(`Success! Profile for "${profile.name}" has been published.`);
      e.target.reset();
    }

    function displaySavedProfiles() {
      let profiles = JSON.parse(localStorage.getItem('restartAiFullProfiles') || '[]');
      const container = document.getElementById('savedProfilesContainer');
      const list = document.getElementById('profilesList');

      if (profiles.length > 0) {
        container.classList.remove('hidden');
        list.innerHTML = profiles.map(p => `
          <div class="bg-slate-950 p-4 rounded-xl border border-purple-500/30 space-y-1 text-xs">
            <p class="font-bold text-white text-sm">👤 ${p.name} (${p.email})</p>
            <p class="text-emerald-400 font-semibold">💼 ${p.role} at ${p.company}</p>
            <p class="text-slate-300"><b>Responsibilities:</b> ${p.resp}</p>
            ${p.skills ? `<p class="text-slate-400"><b>Skills:</b> ${p.skills}</p>` : ''}
            ${p.gap ? `<p class="text-amber-400 italic"><b>Gap Reason:</b> ${p.gap}</p>` : ''}
            <p class="text-cyan-400 font-mono text-[11px]"><b>CV:</b> 📄 ${p.cvName}</p>
          </div>
        `).join('');
      }
    }

    window.onload = function() {
      displaySavedProfiles();
    };
  </script>
</body>
</html>
