<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restart AI - Profile Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#060a12] text-slate-200 min-h-screen p-4 md:p-10">

  <div class="max-w-3xl mx-auto bg-slate-900 border border-slate-700 rounded-3xl p-6 md:p-10 shadow-2xl">
    <h2 class="text-2xl font-bold text-white mb-6 border-b border-slate-700 pb-4">Professional Profile Builder</h2>
    
    <form id="profileForm" class="space-y-6">
      <!-- Basic Info -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="pName" placeholder="Full Name" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3">
        <input type="email" id="pEmail" placeholder="Email Address" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3">
      </div>

      <!-- Experience & Skills -->
      <textarea id="pExp" placeholder="Experience (Job Titles, Companies, Duration)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 h-24"></textarea>
      <input type="text" id="pSkills" placeholder="Skills (Comma separated: e.g. Java, Management, Sales)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3">
      
      <!-- Projects & Languages -->
      <textarea id="pProj" placeholder="Key Projects" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 h-20"></textarea>
      <input type="text" id="pLang" placeholder="Languages Known" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3">

      <!-- Career Gap Reason -->
      <div class="bg-slate-950 p-4 rounded-xl border border-amber-500/30">
        <label class="text-xs text-amber-400 font-bold uppercase mb-2 block">Reason for Career Gap (If any):</label>
        <textarea id="pGap" placeholder="Explain your career gap here..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 h-20"></textarea>
      </div>

      <!-- CV Upload -->
      <div class="border border-dashed border-slate-600 p-4 rounded-xl text-center">
        <input type="file" id="pCv" class="text-xs">
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl">Save & Publish Profile</button>
    </form>

    <!-- Display Area -->
    <div id="displayArea" class="mt-10 pt-10 border-t border-slate-700 space-y-4"></div>
  </div>

  <script>
    document.getElementById('profileForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const profile = {
        name: document.getElementById('pName').value,
        exp: document.getElementById('pExp').value,
        skills: document.getElementById('pSkills').value,
        proj: document.getElementById('pProj').value,
        lang: document.getElementById('pLang').value,
        gap: document.getElementById('pGap').value,
        cv: document.getElementById('pCv').files[0] ? document.getElementById('pCv').files[0].name : "No CV"
      };

      let profiles = JSON.parse(localStorage.getItem('profiles') || '[]');
      profiles.push(profile);
      localStorage.setItem('profiles', JSON.stringify(profiles));
      renderProfiles();
      e.target.reset();
    });

    function renderProfiles() {
      const area = document.getElementById('displayArea');
      const profiles = JSON.parse(localStorage.getItem('profiles') || '[]');
      area.innerHTML = profiles.map(p => `
        <div class="bg-slate-950 p-6 rounded-2xl border border-purple-500/20 space-y-3">
          <h3 class="text-lg font-bold text-white">👤 ${p.name}</h3>
          <p class="text-sm"><b>Experience:</b> ${p.exp}</p>
          <p class="text-sm"><b>Skills:</b> ${p.skills}</p>
          <p class="text-sm text-amber-400"><b>Gap Reason:</b> ${p.gap}</p>
          <p class="text-xs text-emerald-400">📄 ${p.cv}</p>
        </div>
      `).join('');
    }
    window.onload = renderProfiles;
  </script>
</body>
</html>
