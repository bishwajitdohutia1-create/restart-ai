<!-- Experience Detail Section -->
<section id="profileSection" class="bg-slate-900 border border-purple-500/30 rounded-3xl p-6 md:p-8 space-y-6">
  <h2 class="text-xl font-bold text-white border-b border-slate-700 pb-4">Professional Experience Details</h2>
  
  <form id="experienceForm" onsubmit="saveFullProfile(event)" class="space-y-4">
    <!-- Basic Info -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
      <input type="text" id="pName" placeholder="Full Name" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white">
      <input type="email" id="pEmail" placeholder="Email Address" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white">
    </div>

    <!-- Detailed Experience Block -->
    <div class="bg-slate-950 p-5 rounded-2xl border border-slate-700 space-y-3">
      <p class="text-xs font-bold text-emerald-400">Add Professional Experience:</p>
      <input type="text" id="pCompany" placeholder="Company Name" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white">
      <input type="text" id="pRole" placeholder="Job Title / Designation" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white">
      <textarea id="pResponsibility" placeholder="Job Profile & Key Responsibilities (What was your role?)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white h-24"></textarea>
    </div>

    <!-- Skills, Projects & Gap -->
    <input type="text" id="pSkills" placeholder="Skills (Comma separated)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white">
    <textarea id="pGap" placeholder="Reason for Career Gap (if any)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white h-20"></textarea>

    <!-- CV Upload -->
    <div class="border-2 border-dashed border-slate-700 p-4 rounded-xl text-center">
      <input type="file" id="pCvFile" accept=".pdf,.doc,.docx" class="text-xs text-slate-400">
    </div>

    <button type="submit" class="w-full bg-purple-600 text-white font-bold text-sm py-4 rounded-xl">Save & Publish Full Profile</button>
  </form>
</section>
