<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReStartAI - Global AI Re-Employment Platform</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.07);
      border: 1px solid #e2e8f0;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      color: #1e3a8a;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      background-color: #e0e7ff;
      color: #3730a3;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .subtitle {
      margin-top: 12px;
      color: #475569;
      font-size: 14px;
      line-height: 1.5;
    }
    .form-group {
      margin-top: 16px;
    }
    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
      display: block;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      outline: none;
      background-color: #f8fafc;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      resize: vertical;
      outline: none;
      background-color: #f8fafc;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      margin-bottom: 12px;
    }
    .btn {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-align: center;
      transition: all 0.2s ease;
    }
    .btn-outline {
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-outline:hover {
      background-color: #e2e8f0;
    }
    .btn-primary {
      background-color: #1d4ed8;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #1e40af;
    }
    .file-status {
      font-size: 12px;
      color: #2563eb;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .spinner {
      display: none;
      text-align: center;
      padding: 16px;
      color: #2563eb;
      font-weight: 600;
      font-size: 14px;
    }
    .result-box {
      margin-top: 20px;
      padding: 20px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: none;
    }
    .result-title {
      font-size: 17px;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 12px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .result-content {
      font-size: 14px;
      line-height: 1.6;
      color: #334155;
    }
    .result-content h3 {
      color: #1e3a8a;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 15px;
    }
    .result-content h4 {
      color: #2563eb;
      margin-top: 12px;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .result-content ul {
      margin-left: 20px;
      margin-bottom: 10px;
    }
    .result-content li {
      margin-bottom: 4px;
    }
    /* Matching Jobs Card Box */
    .jobs-section {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 2px dashed #cbd5e1;
    }
    .jobs-header {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .job-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .job-title {
      font-weight: 700;
      color: #1e40af;
      font-size: 15px;
    }
    .job-meta {
      font-size: 12px;
      color: #64748b;
    }
    .job-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .job-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      display: inline-block;
    }
    .job-btn-naukri {
      background-color: #0056b3;
      color: #ffffff;
    }
    .job-btn-linkedin {
      background-color: #0a66c2;
      color: #ffffff;
    }
    .job-btn-indeed {
      background-color: #2164f3;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>ReStartAI</h1>
    <span class="badge">AI Career & Global Job Match Engine</span>
    <p class="subtitle">Upload your CV and select your preferred location to find tailored vacancies worldwide.</p>
  </div>

  <div class="form-group">
    <label class="input-label" for="jobLocation">📍 Preferred Job Location (e.g. Guwahati, Remote, India, Singapore, Worldwide):</label>
    <input type="text" id="jobLocation" placeholder="Enter preferred city, country, or 'Remote'..." value="Assam, India">
  </div>

  <input type="file" id="cvFileInput" accept=".pdf,.doc,.docx,.txt" style="display: none;">

  <div class="btn-group">
    <button class="btn btn-outline" onclick="document.getElementById('cvFileInput').click()">Upload CV File</button>
    <button class="btn btn-primary" id="analyzeBtn" onclick="analyzeAndFindJobs()">Match Jobs & Analyze</button>
  </div>

  <div id="fileStatus" class="file-status"></div>

  <div class="form-group">
    <label class="input-label" for="cvText">Or paste your CV / Career details:</label>
    <textarea id="cvText" placeholder="Paste your past experience, skills, and roles here..."></textarea>
  </div>

  <div id="spinner" class="spinner">Searching matched vacancies & analyzing CV...</div>

  <div id="resultBox" class="result-box">
    <div class="result-title">🎯 AI Profile & Career Gap Analysis</div>
    <div id="resultContent" class="result-content"></div>

    <div class="jobs-section">
      <div class="jobs-header">
        <span>💼 Matched Job Vacancies For You</span>
        <span id="targetLocationBadge" style="font-size:12px; font-weight:normal; color:#2563eb;"></span>
      </div>
      <div id="jobsList"></div>
    </div>
  </div>
</div>

<script>
  const fileInput = document.getElementById('cvFileInput');
  const fileStatus = document.getElementById('fileStatus');
  const cvTextArea = document.getElementById('cvText');
  const jobLocationInput = document.getElementById('jobLocation');
  const resultBox = document.getElementById('resultBox');
  const resultContent = document.getElementById('resultContent');
  const targetLocationBadge = document.getElementById('targetLocationBadge');
  const jobsList = document.getElementById('jobsList');
  const spinner = document.getElementById('spinner');
  const analyzeBtn = document.getElementById('analyzeBtn');

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      fileStatus.innerText = 'Selected: ' + file.name;
      if (file.type === "text/plain") {
        const reader = new FileReader();
        reader.onload = function(evt) {
          cvTextArea.value = evt.target.result;
        };
        reader.readAsText(file);
      }
    }
  });

  function formatMarkdown(text) {
    return text
      .replace(/### (.*)/g, '<h3>$1</h3>')
      .replace(/#### (.*)/g, '<h4>$1</h4>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\* (.*)/g, '<li>$1</li>')
      .replace(/\n/g, '<br/>');
  }

  function renderJobMatches(loc) {
    const queryLoc = encodeURIComponent(loc || 'India');
    
    const matchedRoles = [
      {
        title: "Operations Lead / Regional Operations Manager",
        match: "96% Profile Match",
        desc: "Ideal for your multi-year operational leadership, branch supervision, and logistics management background.",
        naukri: `https://www.naukri.com/operations-manager-jobs-in-${queryLoc}`,
        linkedin: `https://www.linkedin.com/jobs/search/?keywords=Operations%20Manager&location=${queryLoc}`,
        indeed: `https://in.indeed.com/jobs?q=Operations+Manager&l=${queryLoc}`
      },
      {
        title: "Corporate Administration & Facilities Lead",
        match: "92% Profile Match",
        desc: "Matches your expertise in administrative coordination, vendor relations, and cross-functional supervision.",
        naukri: `https://www.naukri.com/administration-manager-jobs-in-${queryLoc}`,
        linkedin: `https://www.linkedin.com/jobs/search/?keywords=Administration%20Manager&location=${queryLoc}`,
        indeed: `https://in.indeed.com/jobs?q=Corporate+Administration&l=${queryLoc}`
      },
      {
        title: "Project Coordinator / Field Operations Lead",
        match: "89% Profile Match",
        desc: "Directly aligns with your project execution, on-ground channel handling, and institutional operations experience.",
        naukri: `https://www.naukri.com/project-coordinator-jobs-in-${queryLoc}`,
        linkedin: `https://www.linkedin.com/jobs/search/?keywords=Project%20Coordinator&location=${queryLoc}`,
        indeed: `https://in.indeed.com/jobs?q=Field+Coordinator&l=${queryLoc}`
      },
      {
        title: "Business Channel & Operations Partner (Remote / Global)",
        match: "87% Profile Match",
        desc: "High demand across global organizations, consulting groups, and distributed operations.",
        naukri: `https://www.naukri.com/channel-operations-jobs-in-${queryLoc}`,
        linkedin: `https://www.linkedin.com/jobs/search/?keywords=Channel%20Operations&location=${queryLoc}`,
        indeed: `https://in.indeed.com/jobs?q=Operations+Specialist&l=${queryLoc}`
      }
    ];

    targetLocationBadge.innerText = `Location: ${loc || 'Global'}`;
    
    jobsList.innerHTML = matchedRoles.map(job => `
      <div class="job-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="job-title">${job.title}</span>
          <span style="font-size:11px; background:#dcfce7; color:#15803d; padding:2px 8px; border-radius:99px; font-weight:700;">${job.match}</span>
        </div>
        <p class="job-meta">${job.desc}</p>
        <div class="job-actions">
          <a href="${job.naukri}" target="_blank" class="job-btn job-btn-naukri">Naukri Vacancies ↗</a>
          <a href="${job.linkedin}" target="_blank" class="job-btn job-btn-linkedin">LinkedIn Jobs ↗</a>
          <a href="${job.indeed}" target="_blank" class="job-btn job-btn-indeed">Indeed Search ↗</a>
        </div>
      </div>
    `).join('');
  }

  async function analyzeAndFindJobs() {
    const text = cvTextArea.value.trim();
    const loc = jobLocationInput.value.trim() || 'Global';

    if (!text && !fileInput.files[0]) {
      alert('Please upload your CV or paste details first.');
      return;
    }

    const payloadText = text || ("Resume profile data from uploaded file: " + (fileInput.files[0] ? fileInput.files[0].name : ""));

    spinner.style.display = 'block';
    resultBox.style.display = 'none';
    analyzeBtn.disabled = true;

    try {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cvText: payloadText })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Failed to generate analysis.');
      }

      resultContent.innerHTML = formatMarkdown(data.result);
      renderJobMatches(loc);
      resultBox.style.display = 'block';
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      spinner.style.display = 'none';
      analyzeBtn.disabled = false;
    }
  }
</script>

</body>
</html>
