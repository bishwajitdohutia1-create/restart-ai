<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReStartAI - AI-Powered Re-Employment Platform</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      color: #1e3a8a;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      background-color: #e0e7ff;
      color: #3730a3;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .subtitle {
      margin-top: 14px;
      color: #475569;
      font-size: 15px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      margin-bottom: 16px;
    }
    .btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-align: center;
      transition: all 0.2s ease;
    }
    .btn-outline {
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-outline:hover {
      background-color: #e2e8f0;
    }
    .btn-primary {
      background-color: #1d4ed8;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #1e40af;
    }
    .file-status {
      font-size: 13px;
      color: #2563eb;
      margin-bottom: 12px;
      font-weight: 500;
      word-break: break-all;
    }
    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
      display: block;
    }
    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      resize: vertical;
      outline: none;
    }
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .result-box {
      margin-top: 24px;
      padding: 20px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: none;
    }
    .result-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 12px;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 8px;
    }
    .result-content {
      font-size: 14px;
      line-height: 1.6;
      color: #334155;
    }
    .result-content h3 {
      color: #1e3a8a;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 16px;
    }
    .result-content h4 {
      color: #2563eb;
      margin-top: 12px;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .result-content ul {
      margin-left: 20px;
      margin-bottom: 10px;
    }
    .result-content li {
      margin-bottom: 4px;
    }
    .spinner {
      display: none;
      text-align: center;
      padding: 16px;
      color: #2563eb;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>ReStartAI</h1>
    <span class="badge">AI-Powered Re-Employment Platform</span>
    <p class="subtitle">Your career gap shouldn't define your future. Upload your CV or paste details to get instant career insights.</p>
  </div>

  <input type="file" id="cvFileInput" accept=".pdf,.doc,.docx,.txt" style="display: none;">

  <div class="btn-group">
    <button class="btn btn-outline" onclick="document.getElementById('cvFileInput').click()">Upload CV File</button>
    <button class="btn btn-primary" id="analyzeBtn" onclick="analyzeCV()">Analyze My CV</button>
  </div>

  <div id="fileStatus" class="file-status"></div>

  <label class="input-label" for="cvText">Or paste your CV / Career text here:</label>
  <textarea id="cvText" placeholder="Paste your resume details, skills, and past experience here..."></textarea>

  <div id="spinner" class="spinner">Analyzing your profile with AI...</div>

  <div id="resultBox" class="result-box">
    <div class="result-title">Analysis Result</div>
    <div id="resultContent" class="result-content"></div>
  </div>
</div>

<script>
  const fileInput = document.getElementById('cvFileInput');
  const fileStatus = document.getElementById('fileStatus');
  const cvTextArea = document.getElementById('cvText');
  const resultBox = document.getElementById('resultBox');
  const resultContent = document.getElementById('resultContent');
  const spinner = document.getElementById('spinner');
  const analyzeBtn = document.getElementById('analyzeBtn');

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      fileStatus.innerText = 'Selected: ' + file.name;
      if (file.type === "text/plain") {
        const reader = new FileReader();
        reader.onload = function(evt) {
          cvTextArea.value = evt.target.result;
        };
        reader.readAsText(file);
      }
    }
  });

  function formatMarkdown(text) {
    return text
      .replace(/### (.*)/g, '<h3>$1</h3>')
      .replace(/#### (.*)/g, '<h4>$1</h4>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\* (.*)/g, '<li>$1</li>')
      .replace(/\n/g, '<br/>');
  }

  async function analyzeCV() {
    const text = cvTextArea.value.trim();
    if (!text && !fileInput.files[0]) {
      alert('Please enter your resume text or upload a file first.');
      return;
    }

    const payloadText = text || ("Resume profile data from uploaded file: " + (fileInput.files[0] ? fileInput.files[0].name : ""));

    spinner.style.display = 'block';
    resultBox.style.display = 'none';
    analyzeBtn.disabled = true;

    try {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cvText: payloadText })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Failed to generate analysis.');
      }

      resultContent.innerHTML = formatMarkdown(data.result);
      resultBox.style.display = 'block';
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      spinner.style.display = 'none';
      analyzeBtn.disabled = false;
    }
  }
</script>

</body>
</html>
