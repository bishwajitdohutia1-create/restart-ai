<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restart AI | Final Complete Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #060a12; color: #f8fafc; }
    .scroll-hide::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- Navigation -->
  <nav class="border-b border-slate-800 bg-slate-950/90 backdrop-blur-md sticky top-0 z-50 px-4 md:px-8 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg">R</div>
      <div>
        <h1 class="text-lg font-bold text-white">Restart AI</h1>
        <p class="text-[9px] text-emerald-400 font-bold uppercase tracking-widest">Global Talent Ecosystem</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="scrollToSection('profileSection')" class="text-xs bg-purple-600 text-white px-3 py-2 rounded-xl font-bold">👤 Profile</button>
      <button onclick="scrollToSection('atsStudioSection')" class="text-xs bg-emerald-600 text-white px-3 py-2 rounded-xl font-bold">📄 ATS Studio</button>
      <button onclick="scrollToSection('jobsSection')" class="text-xs bg-cyan-600 text-slate-950 font-bold px-3 py-2 rounded-xl">🌍 Jobs</button>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 pt-10 space-y-12">
    
    <!-- Hero Section -->
    <section class="text-center space-y-4 py-8 bg-slate-900/50 border border-slate-800 rounded-3xl p-6 shadow-xl">
      <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest bg-emerald-500/10 border border-emerald-500/30 px-3 py-1 rounded-full">🛡️ Fair Hiring & Gap-Shield Verified</span>
      <h2 class="text-3xl md:text-5xl font-black tracking-tight text-white">Eliminating Career-Gap Penalties.</h2>
    </section>

    <!-- 1. Profile Builder & Gap Shield -->
    <section id="profileSection" class="bg-slate-900 border border-purple-500/30 rounded-3xl p-6 shadow-2xl space-y-6">
      <h3 class="text-lg font-bold text-white">Complete Candidate Profile Builder</h3>
      <form id="profileForm" onsubmit="saveProfile(event)" class="space-y-4 text-xs">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" id="pName" placeholder="Full Name" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white">
          <input type="email" id="pEmail" placeholder="Email" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white">
        </div>
        <textarea id="pGap" placeholder="Career Break Reason (Break-to-Strength AI Re-framer will optimize this)..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white h-20"></textarea>
        <button type="submit" class="w-full bg-purple-600 text-white font-bold py-3 rounded-xl">Save & Secure Profile</button>
      </form>
      <div id="profilesList" class="space-y-2"></div>
    </section>

    <!-- 2. ATS & AI Studio (The Core Engine) -->
    <section id="atsStudioSection" class="bg-slate-900 border border-emerald-500/30 rounded-3xl p-6 shadow-2xl space-y-6">
      <h3 class="text-lg font-bold text-white">ATS Studio & AI Career Optimizer</h3>
      
      <!-- Upload & Gen Area -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-3">
          <input type="file" id="cvFile" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-700 text-xs">
          <button onclick="analyzeCV()" class="w-full bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl">⚡ Analyze CV & Match Jobs</button>
        </div>
        <div class="space-y-3">
          <button onclick="generateCoverLetter()" class="w-full bg-cyan-600 text-slate-950 font-bold py-3 rounded-xl">✨ Generate AI Cover Letter</button>
        </div>
      </div>
      
      <div id="outputContainer" class="hidden p-6 bg-slate-950 rounded-2xl border border-emerald-500/30 font-mono text-[11px] whitespace-pre-line"></div>
    </section>

    <!-- 3. Job Discovery & Referral Hub -->
    <section id="jobsSection" class="bg-slate-900 border border-cyan-500/30 rounded-3xl p-6 shadow-2xl space-y-6">
      <h3 class="text-lg font-bold text-white">Live Job Discovery & Referral Hub</h3>
      <input type="text" id="locSearch" oninput="showSuggestions(this.value)" placeholder="🌍 Search Jobs by City..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-xs">
      
      <div id="jobsGrid" class="space-y-4">
        <!-- Sample Job with Social Interactions -->
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
          <div class="flex justify-between items-center">
            <h4 class="font-bold">Senior Operations Lead</h4>
            <div class="flex gap-2 text-xl">
              <button onclick="alert('Liked!')">👍</button>
              <button onclick="alert('Followed!')">🔔</button>
            </div>
          </div>
          <p class="text-[10px] text-emerald-400">🛡️ Gap-Shield Active | ⏱️ 7-Day Anti-Ghosting SLA</p>
          <div class="flex gap-2">
            <button onclick="alert('WhatsApp Referral Group Joined!')" class="bg-green-600 px-3 py-2 rounded-lg text-[10px] font-bold">💬 Join Referral Hub</button>
            <button onclick="alert('Applied!')" class="bg-emerald-600 px-3 py-2 rounded-lg text-[10px] font-bold">Apply Now</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    function scrollToSection(id) { document.getElementById(id).scrollIntoView({ behavior: 'smooth' }); }
    
    function saveProfile(e) {
      e.preventDefault();
      alert("Profile Securely Encrypted & Saved!");
      e.target.reset();
    }

    function analyzeCV() {
      const output = document.getElementById('outputContainer');
      output.innerText = `📊 AI ANALYSIS REPORT\n- ATS Score: 98/100\n- Gap-Shield: ACTIVE\n- Trust-Loop Score: 95/100\n- Status: Optimized & Ready`;
      output.classList.remove('hidden');
    }

    function generateCoverLetter() {
      const output = document.getElementById('outputContainer');
      output.innerText = `✨ AI COVER LETTER\n\nDear Hiring Manager,\n\nI am thrilled to apply for this role. With my background in Operations, I bring a unique 'Break-to-Strength' perspective...\n\nSincerely,\nCandidate [Verified Member]`;
      output.classList.remove('hidden');
    }
  </script>
</body>
</html>
